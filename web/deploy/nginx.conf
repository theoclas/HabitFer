server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las locations de abajo usan `expires` (no add_header) para heredar estas cabeceras.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Google Fonts necesita style-src y font-src; el service worker, worker-src.
  # 'wasm-unsafe-eval': el lector de códigos de barras (ZXing) es WebAssembly; solo deja compilar
  # WebAssembly, no permite eval() de JavaScript.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http: https:; worker-src 'self'; manifest-src 'self';" always;

  # La pagina y el service worker nunca se guardan en cache: asi cada despliegue llega solo.
  location = /index.html {
    expires -1;
  }

  location = /sw.js {
    expires -1;
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    expires 1h;
  }

  # Archivos con hash en el nombre: pueden guardarse para siempre.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  location /icons/ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
