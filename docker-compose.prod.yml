services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: habitfer
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - habitfer_db:/var/lib/mysql
    networks:
      - internal
    # No exponer puerto MySQL al host en produccion

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./api/.env.prod
    environment:
      # "Hoy", las rachas y los recordatorios usan la hora local del contenedor.
      TZ: ${TZ:-America/Bogota}
      # Avisos por WhatsApp: la api le habla al servicio wa con este token (vive en el .env de la raiz).
      WA_URL: http://wa:4010
      WA_TOKEN: ${WA_TOKEN:-}
    depends_on:
      - db
    networks:
      - internal
      - web

  # WhatsApp: un celular vinculado (como WhatsApp Web) que envia los avisos. Sin puertos publicos.
  wa:
    build:
      context: ./wa
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WA_TOKEN: ${WA_TOKEN:-}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - habitfer_wa:/data
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - web
    networks:
      - web

networks:
  internal:
  web:

volumes:
  habitfer_db:
  caddy_data:
  habitfer_wa:
