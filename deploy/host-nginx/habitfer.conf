# /etc/nginx/sites-available/habitfer.conf en el VPS: habitfer.fersuastudio.com -> HabitFer.
# HabitFer corre en Docker con su propio Caddy publicado en el puerto 8080 del host.
# Solo HTTP: certbot --nginx agrega el bloque 443 y la redireccion 80 -> 443.
#
#   sudo cp ~/apps/HabitFer/deploy/host-nginx/habitfer.conf /etc/nginx/sites-available/habitfer.conf
#   sudo ln -s /etc/nginx/sites-available/habitfer.conf /etc/nginx/sites-enabled/habitfer.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d habitfer.fersuastudio.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name habitfer.fersuastudio.com;
    server_tokens off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
